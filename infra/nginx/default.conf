# HTTP cho bài thực hành local; TLS/domain dùng cấu hình phát hành riêng.
log_format rigforce '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent request_id=$upstream_http_x_request_id';

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    # Không ghi query string/token, cookie hoặc request body vào access log.
    access_log /var/log/nginx/access.log rigforce;
    client_max_body_size 6m;

    # Docker DNS: resolve lại khi upstream được recreate và đổi IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3001;
    set $front http://front:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Edge ghi đè header client; API trust đúng một hop, không append chuỗi không tin cậy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        # Truyền nguyên URI/query, giữ /api/v1 và raw body cho webhook khi được bật riêng.
        proxy_pass $api$request_uri;
    }

    location / {
        proxy_pass $front$request_uri;
        proxy_buffering off;
    }
}
