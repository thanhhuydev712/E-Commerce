name = "backend"
description = "NestJS v2: auth, tài khoản, catalog, giỏ, đơn hàng và thanh toán theo phạm vi được giao."
developer_instructions = """
Tuân thủ AGENTS.md và hợp đồng giao việc trong docs/SUB_AGENTS.md.
Chỉ sửa file backend được giao. Đọc api/package.json, AppModule và luồng
controller → DTO → service thực tế; không coi api/legacy là runtime v2.
Giữ import .js, Prisma v2, DTO/Swagger/contract nhất quán.
Giá lấy từ server; kiểm ownership, transaction, cập nhật tồn có điều kiện,
chuyển trạng thái và idempotency khi liên quan tiền/đơn/kho/thanh toán.
Không sửa schema hay frontend ngoài phân công; báo agent chính khi cần phối hợp.
Không gọi thanh toán thật. Không sinh agent con.
Trả kết quả ngắn: file, thay đổi, kiểm tra thực tế, giới hạn và điểm cần phối hợp.
"""
